--><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atwood machine · Machine Skill prototype</title></head><body>
<!-- lab-kit:start -->
<script type="module" src="../../.claude/skills/machine/kit/lab-kit.js"></script>
<!-- lab-kit:end -->
<script type="module">
/* MACHINE SKILL BRIEF (2026-10-30): an ideal Atwood teaching rig.
 * Designed dimensions in metres, not a copy of a specific manufactured rig:
 * frame 1.78 x 2.11; base 1.72 x .56; pulley R=.22, width .065;
 * shaft diameter .07; rope diameter .016; blocks .19 x .22 x .16.
 * Assembly: base (paint), two posts and lintel (painted steel), bearing and
 * shaft (steel), pulley rim/hub/spokes (brass), cord (polymer), blocks (paint).
 * Physics: q''=(m2-m1)g/(m1+m2), T=2m1m2g/(m1+m2), q=.5at²,
 * wheel angle=-q/R; q is m2-down. The stop at |q|=.5 is an observation event,
 * not a collision, a failure model, or pulley inertia. Hero: acceleration.
 * This standalone prototype has its own tiny solver. The actual book imports
 * the kit's GEO/MAT into its assembly and drives it from the book clock instead. */
const { THREE, Lab, MAT, GEO } = window.LabKit
const lab = new Lab({prompt:'An ideal Atwood machine: two masses, one rope, one coordinate.',no:4,title:'Atwood machine',sub:'one coordinate, two masses',size:2.1,view:{az:30,el:12,dist:2.4,target:[0,1.08,0]},cut:{a:[0,0,1],b:[0,1,0],center:[0,1.75,.08]},autoOrbit:false})
const matFrame=MAT.paint({color:'#617c73',finish:null}), matBase=MAT.paint({color:'#e1d7c1',finish:null}), matGold=MAT.brass({color:'#c69d60',finish:null}), matSteel=MAT.steel({finish:null}), matRope=MAT.enamel({color:'#98764f',finish:null})
const addBox=(name,w,h,d,pos,mat,explode=[0,0,0])=>lab.mesh(GEO.rbox(w,h,d,.01),mat,{name,pos,explode})
addBox('Base',1.72,.1,.56,[0,.08,0],matBase,[0,-.25,0])
for(const x of [-.75,.75]) addBox('Frame column',.075,1.93,.1,[x,1.085,-.11],matFrame,[x<0?-.25:.25,0,0])
addBox('Lintel',1.60,.08,.1,[0,2.07,-.11],matFrame,[0,.3,0])
addBox('Bearing mount',.13,.35,.11,[0,1.9,-.11],matFrame,[0,0,-.2])
lab.mesh(GEO.disc(.035,.31),matSteel,{name:'Axle',pos:[0,1.75,0],rot:[Math.PI/2,0,0],explode:[0,0,-.25],label:'Axle'})
const wheel = new THREE.Group()
const rim = new THREE.Mesh(GEO.tube(.22,.166,.065),matGold);rim.rotation.x=Math.PI/2;wheel.add(rim)
for(let i=0;i<5;i++){const a=i*2*Math.PI/5;const s=new THREE.Mesh(GEO.rbox(.17,.027,.05,.004),matGold);s.position.set(Math.cos(a)*.095,Math.sin(a)*.095,0);s.rotation.z=a;wheel.add(s)}
const hub=new THREE.Mesh(GEO.disc(.06,.08),matGold);hub.rotation.x=Math.PI/2;wheel.add(hub);wheel.position.set(0,1.75,.08)
lab.add(wheel,{name:'Pulley and hub',explode:[0,0,.3],label:'Pulley',at:[0,.18,0]})
const block1=addBox('Mass 1',.19,.22,.16,[-.22,.89,.128],MAT.paint({color:'#76a69b',finish:null}),[-.25,0,0]);lab.label(block1,'m1',{at:[0,0,.08]})
const block2=addBox('Mass 2',.19,.22,.16,[.22,.89,.128],MAT.paint({color:'#ce8069',finish:null}),[.25,0,0]);lab.label(block2,'m2',{at:[0,0,.08]})
lab.mesh(new THREE.TorusGeometry(.22,.008,8,64,Math.PI),matRope,{name:'Rope arc',pos:[0,1.75,.128]})
const rope1=lab.mesh(new THREE.CylinderGeometry(.008,.008,1,12),matRope,{name:'Left rope',pos:[-.22,1.375,.128],scale:[1,.75,1]})
const rope2=lab.mesh(new THREE.CylinderGeometry(.008,.008,1,12),matRope,{name:'Right rope',pos:[.22,1.375,.128],scale:[1,.75,1]})
lab.hero({label:'Acceleration',unit:'m/s²',max:10,digits:2})
let elapsed=0, q=0
const mass2=lab.slider({id:'m2',label:'Right mass',min:.2,max:5,value:2,unit:'kg',digits:1,ends:['0.2 kg','5 kg'],onInput:()=>{elapsed=0;q=0;lab.paused=true}})
lab.onTick((dt)=>{
  const m1=1,m2=mass2.value,g=9.81,a=(m2-m1)*g/(m1+m2), tension=2*m1*m2*g/(m1+m2)
  if(!lab.paused){elapsed+=dt;q=.5*a*elapsed*elapsed;if(Math.abs(q)>=.5){q=Math.sign(q)*.5;lab.paused=true;lab._syncButtons()}}
  wheel.rotation.z=-q/.22
  lab.place(block1,-.22,.89+q,.128);lab.place(block2,.22,.89-q,.128)
  const l1=.75-q,l2=.75+q;rope1.scale.y=l1;rope2.scale.y=l2
  lab.place(rope1,-.22,1.75-l1/2,.128);lab.place(rope2,.22,1.75-l2/2,.128)
  lab.setHero(a,{state:Math.abs(q)>=.5?'at travel stop':lab.paused?'paused':'running',sub:`tension ${tension.toFixed(2)} N · q ${q.toFixed(3)} m`})
})
lab.how('Ideal, inextensible massless rope and massless pulley; motion stops at either travel boundary. The rotor’s visible geometry has no inertia in this ideal model.', ['a = (m2 − m1)g / (m1 + m2)', 'T = 2 m1 m2 g / (m1 + m2)', 'theta = −q / R'])
lab.paused=true
lab.start()
</script></body></html>
